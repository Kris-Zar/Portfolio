<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark warm background -->
  <rect width="64" height="64" rx="14" fill="#0E0600"/>

  <!-- Bold P letterform -->
  <text x="2" y="58" font-family="Impact, Arial Black, sans-serif" font-size="56" font-weight="900" fill="#EF9F27">P</text>

  <!-- Diagonal glitch slash mask -->
  <polygon points="0,42 64,6 64,20 0,56" fill="#0E0600"/>

  <!-- Glitch slash line -->
  <line x1="2" y1="44" x2="62" y2="10" stroke="#FCDE5A" stroke-width="3" stroke-linecap="round"/>

  <!-- Glitch bars -->
  <rect x="14" y="30" width="30" height="2.5" rx="1" fill="#FAC775" opacity="0.7"/>
  <rect x="24" y="24" width="18" height="1.5" rx="0.8" fill="#EF9F27" opacity="0.5"/>
  <rect x="8"  y="36" width="12" height="1.2" rx="0.6" fill="#FCDE5A" opacity="0.3"/>

  <!-- Warm glow dot at slash origin -->
  <circle cx="6" cy="42" r="4" fill="#EF9F27" opacity="0.25"/>
</svg>
